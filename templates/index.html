<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Pemantau Real-time</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 15px, transparent 15px, transparent 30px);
            animation: moveConveyor 20s linear infinite; z-index: -1;
        }
        @keyframes moveConveyor { from { background-position: 0 0; } to { background-position: 100px 0; } }
        .card { background: rgba(31, 41, 55, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }

        /* Efek glow biru saat ada deteksi baru */
        @keyframes glow {
            0%   { box-shadow: 0 0 5px rgba(59,130,246,0); }
            50%  { box-shadow: 0 0 20px 5px rgba(59,130,246,0.6); }
            100% { box-shadow: 0 0 5px rgba(59,130,246,0); }
        }
        .glow-effect { animation: glow 1.5s ease-in-out; }

        /* Efek glow merah saat crossing terdeteksi */
        @keyframes glow-red {
            0%   { box-shadow: 0 0 5px rgba(239,68,68,0); }
            30%  { box-shadow: 0 0 30px 10px rgba(239,68,68,0.8); }
            100% { box-shadow: 0 0 5px rgba(239,68,68,0); }
        }
        .glow-red { animation: glow-red 1s ease-out; }

        /* Badge crossing */
        @keyframes fadeInOut {
            0%   { opacity: 0; transform: scale(0.8); }
            20%  { opacity: 1; transform: scale(1.05); }
            80%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.9); }
        }
        #crossing-badge { animation: fadeInOut 2.5s ease forwards; }
    </style>
</head>

<body class="bg-gray-900 text-gray-200 antialiased">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-teal-300 pb-2">
                Dasbor Pemantau Sistem Sortir
            </h1>
            <p id="realtime-clock" class="text-base sm:text-lg font-medium text-gray-400 mt-4"></p>
            <a href="{{ url_for('data_history') }}" 
               class="mt-4 inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-transform transform hover:scale-105">
                Lihat Riwayat Data
            </a>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

            <!-- Kolom Kiri: Feed + Gambar terakhir -->
            <div class="md:col-span-2 lg:col-span-2 space-y-8">

                <!-- Live Feed -->
                <div class="card rounded-xl p-6 shadow-2xl">
                    <h2 class="text-2xl font-semibold mb-4">Live Feed Kamera</h2>
                    <div class="bg-black rounded-lg overflow-hidden aspect-video shadow-inner">
                        <img src="{{ url_for('video_feed') }}" class="w-full h-full">
                    </div>
                </div>

                <!-- Gambar terakhir yang dideteksi -->
                <div id="last-capture-card" class="card rounded-xl p-6 shadow-2xl relative">
                    <h2 class="text-2xl font-semibold mb-4">Gambar Terakhir yang Dideteksi</h2>

                    <!-- Badge Crossing (tersembunyi by default) -->
                    <div id="crossing-badge-wrapper" class="hidden absolute top-6 right-6 z-10">
                        <div id="crossing-badge" 
                             class="bg-red-600 text-white text-sm font-bold px-4 py-2 rounded-full flex items-center gap-2 shadow-lg">
                            <span class="w-2 h-2 bg-white rounded-full inline-block animate-ping"></span>
                            CROSSING TERDETEKSI
                        </div>
                    </div>

                    <div class="bg-black rounded-lg overflow-hidden aspect-video shadow-inner flex justify-center items-center">
                        <img id="captured-image" src="" class="w-full h-full hidden">
                        <span id="capture-placeholder" class="text-gray-500">Menunggu deteksi pertama...</span>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan: Info deteksi + counter + log -->
            <div class="md:col-span-2 lg:col-span-1 card rounded-xl p-6 shadow-2xl flex flex-col">

                <!-- Hasil Deteksi Terakhir -->
                <div>
                    <h2 class="text-2xl font-semibold mb-4">Hasil Deteksi Terakhir</h2>
                    <div id="detection-info" class="text-center p-4 bg-gray-700/50 rounded-lg mb-4">
                        <p class="text-gray-400">Menunggu data...</p>
                    </div>

                    <!-- Status Crossing -->
                    <div id="crossing-status" class="hidden mb-4 p-3 bg-red-900/40 border border-red-500/50 rounded-lg text-center">
                        <p class="text-red-400 text-sm font-semibold">🚨 Terakhir Crossing</p>
                        <p id="crossing-bolt-name" class="text-white font-bold text-lg mt-1">—</p>
                        <p id="crossing-time" class="text-gray-400 text-xs mt-1">—</p>
                    </div>

                    <!-- Distribusi & Counter -->
                    <h2 class="text-2xl font-semibold my-4">Distribusi &amp; Total Sesi Ini</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center">
                        <div class="relative w-full h-48">
                            <canvas id="distributionChart"></canvas>
                        </div>
                        <div id="bolt-counters" class="space-y-2"></div>
                    </div>

                    <div class="mt-6 pt-4 border-t border-gray-700 text-center">
                        <p class="text-gray-400 text-lg">Total Semua Baut (Sesi Ini)</p>
                        <p id="total-bolts" class="text-4xl lg:text-5xl font-bold mt-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-teal-300">0</p>
                    </div>
                </div>

                <!-- Log Aktivitas -->
                <div class="flex-grow mt-6 flex flex-col">
                    <h2 class="text-2xl font-semibold">Log Aktivitas</h2>
                    <div id="log-container" class="mt-4 bg-gray-800/50 p-4 rounded-lg h-48 overflow-y-auto text-sm font-mono flex-grow"></div>
                </div>
            </div>

        </main>
    </div>

<!-- ================================================================
     SCRIPT UTAMA: SocketIO + UI Update
     ================================================================ -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const socket = io({ path: '/socket.io' });

    // --- Elemen DOM ---
    const logContainer        = document.getElementById('log-container');
    const capturedImage       = document.getElementById('captured-image');
    const capturePlaceholder  = document.getElementById('capture-placeholder');
    const detectionInfo       = document.getElementById('detection-info');
    const boltCountersContainer = document.getElementById('bolt-counters');
    const lastCaptureCard     = document.getElementById('last-capture-card');
    const clockElement        = document.getElementById('realtime-clock');
    const totalBoltsElement   = document.getElementById('total-bolts');
    const crossingStatus      = document.getElementById('crossing-status');
    const crossingBoltName    = document.getElementById('crossing-bolt-name');
    const crossingTime        = document.getElementById('crossing-time');
    const crossingBadgeWrapper = document.getElementById('crossing-badge-wrapper');

    let distributionChart;
    let crossingBadgeTimer = null;

    const boltTypes = ["Carriage Bolt", "Flange Bolt", "Hex Bolt", "Socket Cap"];
    const colors = {
        "Carriage Bolt": "#60a5fa",
        "Flange Bolt":   "#5eead4",
        "Hex Bolt":      "#a5b4fc",
        "Socket Cap":    "#f9a8d4"
    };

    // --- Jam realtime ---
    function updateClock() {
        const options = { weekday:'long', year:'numeric', month:'long', day:'numeric',
                          hour:'2-digit', minute:'2-digit', second:'2-digit' };
        clockElement.textContent = new Date().toLocaleDateString('id-ID', options);
    }

    // --- Buat counter baut ---
    function generateCounters() {
        boltCountersContainer.innerHTML = '';
        boltTypes.forEach(bolt => {
            const id = bolt.replace(/\s+/g, '-');
            boltCountersContainer.innerHTML += `
                <div class="bg-gray-700/50 p-2 rounded-lg flex justify-between items-center text-sm">
                    <span class="font-medium">${bolt}</span>
                    <span id="${id}-count" class="text-xl font-bold px-2 rounded-md" style="color:${colors[bolt]}">0</span>
                </div>`;
        });
    }

    // --- Tambah log (merah untuk crossing, hijau untuk yang lain) ---
    function addLog(message, isRed = false) {
        const time  = new Date().toLocaleTimeString('id-ID');
        const color = isRed ? 'text-red-400' : 'text-green-400';
        logContainer.innerHTML =
            `<p><span class="${color}">${time} ></span> ${message}</p>` + logContainer.innerHTML;
    }

    // --- Init chart donut ---
    function initializeChart() {
        const ctx = document.getElementById('distributionChart').getContext('2d');
        distributionChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: boltTypes,
                datasets: [{
                    label: 'Jumlah Baut',
                    data: [0, 0, 0, 0],
                    backgroundColor: Object.values(colors),
                    borderColor: '#1f2937',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right', labels: { color: '#d1d5db', boxWidth: 15 } }
                }
            }
        });
    }

    // --- Tampilkan badge crossing selama 2.5 detik ---
    function showCrossingBadge() {
        if (crossingBadgeTimer) clearTimeout(crossingBadgeTimer);

        // Reset animasi dengan clone trick
        const oldBadge = document.getElementById('crossing-badge');
        const newBadge = oldBadge.cloneNode(true);
        newBadge.id = 'crossing-badge';
        oldBadge.replaceWith(newBadge);

        crossingBadgeWrapper.classList.remove('hidden');
        crossingBadgeTimer = setTimeout(() => {
            crossingBadgeWrapper.classList.add('hidden');
        }, 2500);
    }

    // =====================================================
    // EVENT: DETEKSI BIASA — update gambar + counter + chart
    // =====================================================
    socket.on('detection_event', (data) => {
        // Update gambar terakhir
        capturePlaceholder.classList.add('hidden');
        capturedImage.src = `data:image/jpeg;base64,${data.image_data}`;
        capturedImage.classList.remove('hidden');

        // Efek glow biru
        lastCaptureCard.classList.remove('glow-effect');
        void lastCaptureCard.offsetWidth;
        lastCaptureCard.classList.add('glow-effect');

        // Panel info deteksi
        // data.confidence sudah dalam 0-100 (dikirim dari Python sebagai round(confidence*100, 1))
        const boltColor = colors[data.bolt] || '#ffffff';
        if (data.bolt !== "Tidak Terdeteksi") {
            detectionInfo.innerHTML = `
                <p class="text-4xl font-bold" style="color:${boltColor}">${data.bolt}</p>
                <p class="text-gray-300 mt-1">Kepercayaan: <span class="font-semibold text-lg">${data.confidence}%</span></p>
                <p class="text-gray-500 text-xs mt-1">${data.timestamp}</p>`;
        } else {
            detectionInfo.innerHTML = `
                <p class="text-gray-400 text-lg">Tidak Terdeteksi</p>
                <p class="text-gray-500 text-xs mt-1">${data.timestamp}</p>`;
        }

        // Update counter & chart
        let totalCount = 0;
        const chartData = [];
        for (const boltName of boltTypes) {
            const count = data.counts[boltName] || 0;
            totalCount += count;
            chartData.push(count);

            const counterElem = document.getElementById(`${boltName.replace(/\s+/g, '-')}-count`);
            if (counterElem) counterElem.textContent = count;
        }
        totalBoltsElement.textContent = totalCount;
        distributionChart.data.datasets[0].data = chartData;
        distributionChart.update();
    });

    // =====================================================
    // EVENT: CROSSING LINE — visual feedback di dashboard
    // =====================================================
    socket.on('bolt_crossed_line', (data) => {
        addLog(`🚨 CROSSING: ${data.bolt} (${data.confidence}%)`, true);

        // Efek glow merah pada kartu gambar
        lastCaptureCard.classList.remove('glow-red');
        void lastCaptureCard.offsetWidth;
        lastCaptureCard.classList.add('glow-red');

        // Update panel status crossing
        crossingStatus.classList.remove('hidden');
        crossingBoltName.textContent = data.bolt;
        crossingBoltName.style.color = colors[data.bolt] || '#ffffff';
        crossingTime.textContent = `Waktu: ${data.timestamp} · Conf: ${data.confidence}%`;

        // Tampilkan badge merah di atas gambar
        showCrossingBadge();
    });

    // --- SocketIO system events ---
    socket.on('connect',    () => addLog('Terhubung ke server SocketIO.'));
    socket.on('system_log', (msg) => addLog(`[SISTEM] ${msg.data}`));

    // --- Init ---
    generateCounters();
    initializeChart();
    updateClock();
    setInterval(updateClock, 1000);
});
</script>

<!-- ================================================================
     SCRIPT MQTT: Publish ke HiveMQ Cloud saat crossing terdeteksi
     ================================================================ -->
<script src="{{ url_for('static', filename='mqtt_client.js') }}"></script>

</body>
</html>
